<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bandi Radar MI</title><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#17202e}.wrap{max-width:1180px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.btn{border:0;background:#285fe8;color:#fff;padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #e5e9ef;border-radius:12px;padding:16px}.card b{font-size:22px}.muted{color:#687386}.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:14px 0}.filters input,.filters select{padding:10px;border:1px solid #dfe4ec;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-top:1px solid #e7ebf1;text-align:left}th{font-size:11px;color:#6d7889}.score{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;font-weight:800}.hi{background:#eaf8f2;color:#16865e}.mid{background:#fff7e6;color:#a56a0f}.overlay{position:fixed;inset:0;background:#0b1424aa;display:flex}.modal{margin:auto;background:#fff;width:min(620px,92vw);max-height:86vh;overflow:auto;padding:22px;border-radius:14px}.tag{font-size:10px;background:#eef3ff;padding:4px 6px;border-radius:5px;margin-right:4px}.star{border:0;background:none;font-size:20px;cursor:pointer}.on{color:#e0a019}@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.wrap{padding:16px}}@media(max-width:460px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div><h1>Bandi Radar MI</h1><div class="muted">MVP per ricerca e prioritizzazione opportunità di finanziamento</div></div><button class="btn" onclick="addForm()">+ Inserisci bando</button></div><div class="cards"><div class="card"><div class="muted">Alta priorità</div><b id="best">0</b></div><div class="card"><div class="muted">Bandi monitorati</div><b id="total">0</b></div><div class="card"><div class="muted">Fonti</div><b id="sources">0</b></div><div class="card"><div class="muted">Preferiti</div><b id="fav">0</b></div></div><div class="panel"><h2>Opportunità ordinate per compatibilità</h2><div class="filters"><input id="q" placeholder="Cerca tecnologia o keyword" oninput="render()"><select id="territory" onchange="render()"><option>Tutti</option><option>Sicilia</option><option>Italia</option><option>Lombardia</option><option>UE</option></select><select id="min" onchange="render()"><option value="0">Qualsiasi score</option><option value="70">Score ≥ 70</option><option value="85">Score ≥ 85</option></select></div><div style="overflow:auto"><table><thead><tr><th>Score</th><th>Bando</th><th>Territorio</th><th>Scadenza</th><th>Contributo</th><th>Fonte</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></div><div id="portal"></div><script>const seed=[{id:'c&i2',title:'Collabora & Innova – Edizione 2',source:'Regione Lombardia',territory:['Lombardia'],deadline:'2026-10-15',grant:60,sectors:['Industria 4.0','Energia','Digitalizzazione'],kw:['ricerca industriale','digital twin','IoT','S3'],summary:'Progetti collaborativi di ricerca industriale e sviluppo sperimentale coerenti con gli ecosistemi S3 lombardi.',url:'https://www.openinnovation.regione.lombardia.it/it/bandi-e-sperimentazioni/collabora-innova/collabora-innova-edizione-2'},{id:'mimit',title:'Accordi per l’innovazione – filiere strategiche',source:'MIMIT',territory:['Italia'],deadline:'2026-11-30',grant:50,sectors:['Automazione','Energia','Elettronica'],kw:['ricerca industriale','automazione','efficienza energetica'],summary:'Programma nazionale per progetti di ricerca e sviluppo di rilevanza strategica.',url:'https://www.mimit.gov.it/'},{id:'horizon',title:'Horizon Europe Cluster 5 – Clean Industry Demonstrators',source:'Commissione Europea',territory:['UE'],deadline:'2026-12-02',grant:70,sectors:['Energia','Industria 4.0','Sostenibilità'],kw:['decarbonizzazione','digital twin','AI','IoT'],summary:'Dimostratori industriali per decarbonizzazione e digitalizzazione.',url:'https://ec.europa.eu/info/funding-tenders/opportunities/portal/'},{id:'step',title:'STEP Sicilia – Tecnologie digitali e clean tech',source:'Regione Siciliana',territory:['Sicilia'],deadline:'2026-09-28',grant:55,sectors:['Elettronica','Energia','Digitalizzazione'],kw:['microelettronica','clean tech','IoT','automazione'],summary:'Investimenti in tecnologie strategiche digitali e pulite.',url:'https://www.euroinfosicilia.it/'},{id:'invitalia',title:'Transizione digitale delle PMI industriali',source:'Invitalia',territory:['Italia'],deadline:'2026-10-31',grant:40,sectors:['Digitalizzazione','Industria 4.0'],kw:['MES','IoT','AI','cloud'],summary:'Adozione di tecnologie digitali e sistemi interconnessi nelle PMI industriali.',url:'https://www.invitalia.it/'},{id:'life',title:'LIFE Clean Energy Transition',source:'CINEA',territory:['UE'],deadline:'2026-09-17',grant:95,sectors:['Energia','Sostenibilità'],kw:['efficienza energetica','clean energy','building'],summary:'Azioni europee per accelerare la transizione energetica.',url:'https://cinea.ec.europa.eu/programmes/life_en'},{id:'eic',title:'EIC Transition – Industrial validation',source:'European Innovation Council',territory:['UE'],deadline:'2026-09-16',grant:100,sectors:['Elettronica','Digitalizzazione','Energia'],kw:['deep tech','prototype','sensors'],summary:'Validazione tecnologica per risultati di ricerca ad alto potenziale.',url:'https://eic.ec.europa.eu/'},{id:'sicilia-s3',title:'Ricerca collaborativa Sicilia – S3',source:'Regione Siciliana',territory:['Sicilia'],deadline:'2027-01-20',grant:60,sectors:['Industria 4.0','Energia','Elettronica'],kw:['S3','ricerca industriale','università','IoT'],summary:'Progetti collaborativi impresa-ricerca nei domini S3 Sicilia.',url:'https://www.euroinfosicilia.it/'}];let manual=JSON.parse(localStorage.getItem('br-manual')||'[]'),items=[...seed,...manual],favorites=JSON.parse(localStorage.getItem('br-fav')||'[]');const profile={regions:['Sicilia','Italia','UE'],sectors:['Energia','Elettronica','Automazione','Industria 4.0','Digitalizzazione','Sostenibilità'],kw:['IoT','digital twin','automazione','energia','ricerca industriale','AI']};function sc(o){let n=20;n+=Math.min(30,o.sectors.filter(x=>profile.sectors.includes(x)).length*10);n+=Math.min(25,o.kw.filter(x=>profile.kw.some(k=>x.toLowerCase().includes(k.toLowerCase())||k.toLowerCase().includes(x.toLowerCase()))).length*5);n+=o.territory.some(t=>profile.regions.includes(t)||t==='Italia'||t==='UE')?15:-15;n+=o.grant>=40?5:0;return Math.max(0,Math.min(100,n))}function render(){let q=document.querySelector('#q').value.toLowerCase(),t=document.querySelector('#territory').value,min=+document.querySelector('#min').value;let a=items.map(o=>({o,s:sc(o)})),list=a.filter(x=>(x.o.title+' '+x.o.kw.join(' ')).toLowerCase().includes(q)&&(t==='Tutti'||x.o.territory.includes(t))&&x.s>=min).sort((x,y)=>y.s-x.s);document.querySelector('#rows').innerHTML=list.map(x=>`<tr onclick="detail('${x.o.id}')"><td><span class="score ${x.s>=80?'hi':'mid'}">${x.s}</span></td><td><b>${x.o.title}</b><div>${x.o.sectors.map(z=>`<span class='tag'>${z}</span>`).join('')}</div></td><td>${x.o.territory.join(', ')}</td><td>${new Date(x.o.deadline).toLocaleDateString('it-IT')}</td><td><b>${x.o.grant}%</b></td><td>${x.o.source}</td><td><button class="star ${favorites.includes(x.o.id)?'on':''}" onclick="event.stopPropagation();fav('${x.o.id}')">★</button></td></tr>`).join('');document.querySelector('#best').textContent=a.filter(x=>x.s>=70).length;document.querySelector('#total').textContent=items.length;document.querySelector('#sources').textContent=new Set(items.map(x=>x.source)).size;document.querySelector('#fav').textContent=favorites.length}function fav(id){favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];localStorage.setItem('br-fav',JSON.stringify(favorites));render()}function detail(id){let o=items.find(x=>x.id===id),s=sc(o);document.querySelector('#portal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeP()"><div class="modal"><button style="float:right" class="star" onclick="closeP()">×</button><div class="muted">${o.source}</div><h2>${o.title}</h2><div class="score ${s>=80?'hi':'mid'}">${s}</div><p>${o.summary}</p><p><b>Territorio:</b> ${o.territory.join(', ')} · <b>Contributo:</b> ${o.grant}% · <b>Scadenza:</b> ${new Date(o.deadline).toLocaleDateString('it-IT')}</p><h3>Analisi automatica</h3><p>Compatibilità calcolata su territorio, settori strategici, keyword e intensità di contributo. Verificare sempre requisiti e testo ufficiale prima della candidatura.</p><a class="btn" target="_blank" href="${o.url}">Apri fonte ufficiale</a></div></div>`}function closeP(){document.querySelector('#portal').innerHTML=''}function addForm(){document.querySelector('#portal').innerHTML=`<div class="overlay"><div class="modal"><h2>Inserisci bando</h2><input id="at" placeholder="Titolo"><br><br><input id="as" placeholder="Fonte" value="Fonte manuale"><br><br><input id="ad" type="date" value="2026-12-31"><br><br><input id="ak" placeholder="Keyword, separate da virgola" value="IoT, automazione"><br><br><button class="btn" onclick="addItem()">Aggiungi e valuta</button> <button class="btn" onclick="closeP()">Chiudi</button></div></div>`}function addItem(){let t=document.querySelector('#at').value.trim();if(!t)return;manual.push({id:'m'+Date.now(),title:t,source:document.querySelector('#as').value,territory:['Italia'],deadline:document.querySelector('#ad').value,grant:50,sectors:['Digitalizzazione'],kw:document.querySelector('#ak').value.split(',').map(x=>x.trim()),summary:'Bando inserito manualmente per una prima valutazione.',url:'#'});localStorage.setItem('br-manual',JSON.stringify(manual));items=[...seed,...manual];closeP();render()}render();</script></body></html>
